<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Google Analytics 4 — G-VTNZKL95DQ
      Placed directly after <meta charset> because Google asks for it as high in
      <head> as possible, and a gtag before the charset declaration would be
      parsed under the wrong encoding.

      Hardcoded rather than env-driven, deliberately. The Umami block at the
      bottom of <body> is env-driven and has never run: VITE_ANALYTICS_ENDPOINT
      and VITE_ANALYTICS_WEBSITE_ID were never set, so its guard returns early
      and the live page ships a literal "%VITE_ANALYTICS_ENDPOINT%" string. An
      analytics tag that silently does nothing is the failure being avoided here.

      A GA4 Measurement ID is not a secret — it is served to every visitor in
      this file — so there is nothing to protect by moving it into the
      environment.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VTNZKL95DQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-VTNZKL95DQ");
    </script>
    <!-- maximum-scale blocks pinch-zoom; it fails accessibility audits and is not needed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmbeddedOS — The Operating System for Every Device</title>
    <!--
      "83 supported boards" is STACK.totals.boards from shared/stack-data.ts.
      This read "52+ platforms" — the figure retired everywhere else in the site
      because eos/boards holds 83 board definitions. The guard in
      tests/integration/stack-claims.test.ts scans visible page text, which a
      meta tag is not, so the stale claim survived here and went on being read by
      crawlers and link previews. That test now checks meta descriptions too.
    -->
    <meta
      name="description"
      content="EmbeddedOS — The open-source operating system for every device. 14 components, 83 supported boards, 300+ APIs."
    />
    <meta name="theme-color" content="#0B1D3A" />
    <link rel="canonical" href="https://www.embeddedos.org/" />
    <!--
      Icons. The site previously declared none and shipped none, so /favicon.ico
      answered 404 and tabs, bookmarks and home-screen shortcuts had no mark.
      Generated from the navbar's own logo by scripts/generate-favicons.mjs, so
      the tab icon cannot drift from the header.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.embeddedos.org/" />
    <meta property="og:site_name" content="EmbeddedOS" />
    <meta
      property="og:title"
      content="EmbeddedOS — The Operating System for Every Device"
    />
    <meta
      property="og:description"
      content="Open-source embedded OS powering IoT, edge AI, automotive, and industrial systems."
    />
    <meta
      property="og:image"
      content="https://www.embeddedos.org/media/hero-background_1bafea1c.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Nonprofit identity as structured data. Google reads the mission, the legal
      name and the tax ID from the page text either way, but only a reviewer
      does; this states the same facts in a form the crawler parses directly.
      Every value here is duplicated from client/src/data/foundation.ts — change
      both, or neither. tests/unit/foundation-schema.test.ts fails if they drift.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NGO",
        "name": "Embedded Operating Systems Research Foundation",
        "alternateName": "EmbeddedOS Foundation",
        "url": "https://www.embeddedos.org",
        "logo": "https://www.embeddedos.org/media/embeddedos-logo-mark_bc053888.jpg",
        "description": "A 501(c)(3) public charity advancing open-source embedded systems research, education and technology for the public benefit.",
        "taxID": "41-4821627",
        "nonprofitStatus": "Nonprofit501c3",
        "foundingDate": "2018",
        "areaServed": "Worldwide",
        "email": "contact@embeddedos.org",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "2601 Cortez Dr",
          "addressLocality": "Santa Clara",
          "addressRegion": "CA",
          "postalCode": "95051",
          "addressCountry": "US"
        },
        "sameAs": [
          "https://github.com/embeddedos-org",
          "https://x.com/EmbeddedOS_ORG",
          "https://www.linkedin.com/company/embedded-operating-systems-research-foundation",
          "https://www.youtube.com/@EmbeddedOS_ORG",
          "https://www.instagram.com/embeddedos.org",
          "https://www.facebook.com/profile.php?id=61588978691494"
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load webfonts without blocking first render. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Analytics loads only when VITE_ANALYTICS_* are actually configured.
      Vite leaves %PLACEHOLDERS% untouched when the env var is unset, and a bare
      <script src="%VITE_ANALYTICS_ENDPOINT%/umami"> would then request a
      literal-percent URL on every page load and try to execute the HTML
      response as JavaScript.
    -->
    <script>
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (
          !endpoint ||
          !websiteId ||
          endpoint.charAt(0) === "%" ||
          websiteId.charAt(0) === "%"
        )
          return;
        var s = document.createElement("script");
        s.defer = true;
        s.src = endpoint + "/umami";
        s.setAttribute("data-website-id", websiteId);
        document.head.appendChild(s);
      })();
    </script>
  </body>
</html>
