<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale blocks pinch-zoom; it fails accessibility audits and is not needed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmbeddedOS — The Operating System for Every Device</title>
    <!--
      Critical CSS: above-the-fold essentials inlined so first paint does
      not wait for the deferred 45 KB stylesheet (F-07). Source of truth is
      client/src/critical.css — copy it here verbatim when it changes.
    -->
    <style>*,*::before,*::after{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}body{margin:0;background-color:#0b1d3a;color:#eef2f7;font-family:"DM Sans",system-ui,-apple-system,sans-serif;font-size:1rem;line-height:1.6;min-height:100vh;overflow-x:hidden}h1,h2,h3,h4,h5,h6{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;line-height:1.2;letter-spacing:-0.02em;margin:0 0 .5em}p{margin:0 0 1em}img{max-width:100%;height:auto}#root{min-height:100vh}main{display:block}.skip-to-content{position:absolute;top:-100%;left:1rem;z-index:9999;padding:.75rem 1.5rem;background:#f97316;color:#fff;border-radius:.5rem;font-weight:600}.skip-to-content:focus{top:1rem}</style>
    <!-- Keep this count aligned with STACK.totals.boards in shared/stack-data.ts. -->
    <meta
      name="description"
      content="EmbeddedOS — The open-source operating system for every device. 14 components, 83 board definitions, 300+ APIs."
    />
    <meta name="theme-color" content="#0B1D3A" />
    <link rel="canonical" href="https://www.embeddedos.org/" />
    <!--
      Icons. The site previously declared none and shipped none, so /favicon.ico
      answered 404 and tabs, bookmarks and home-screen shortcuts had no mark.
      Generated from the navbar's own logo by scripts/generate-favicons.mjs, so
      the tab icon cannot drift from the header.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.embeddedos.org/" />
    <meta property="og:site_name" content="EmbeddedOS" />
    <meta
      property="og:title"
      content="EmbeddedOS — The Operating System for Every Device"
    />
    <meta
      property="og:description"
      content="Open-source embedded OS powering IoT, edge AI, automotive, and industrial systems."
    />
    <meta
      property="og:image"
      content="https://www.embeddedos.org/media/hero-background_1bafea1c.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="EmbeddedOS — The Operating System for Every Device"
    />
    <meta
      name="twitter:description"
      content="Open-source embedded OS powering IoT, edge AI, automotive, and industrial systems."
    />
    <meta
      name="twitter:image"
      content="https://www.embeddedos.org/media/hero-background_1bafea1c.jpg"
    />
    <!--
      Nonprofit identity as structured data. Google reads the mission, the legal
      name and the tax ID from the page text either way, but only a reviewer
      does; this states the same facts in a form the crawler parses directly.
      Every value here is duplicated from client/src/data/foundation.ts — change
      both, or neither. tests/unit/foundation-facts.test.ts fails if they drift.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NGO",
        "name": "Embedded Operating Systems Research Foundation",
        "alternateName": "EmbeddedOS Foundation",
        "url": "https://www.embeddedos.org",
        "logo": "https://www.embeddedos.org/media/embeddedos-logo-mark_bc053888.jpg",
        "description": "A 501(c)(3) public charity advancing open-source embedded systems research, education and technology for the public benefit.",
        "taxID": "41-4821627",
        "nonprofitStatus": "Nonprofit501c3",
        "foundingDate": "2018",
        "areaServed": "Worldwide",
        "email": "contact@embeddedos.org",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "2601 Cortez Dr, Unit 1104",
          "addressLocality": "Santa Clara",
          "addressRegion": "CA",
          "postalCode": "95051",
          "addressCountry": "US"
        },
        "sameAs": [
          "https://github.com/embeddedos-org",
          "https://x.com/EmbeddedOS_ORG",
          "https://www.linkedin.com/company/embedded-operating-systems-research-foundation",
          "https://www.youtube.com/@EmbeddedOS_ORG",
          "https://www.instagram.com/embeddedos_org",
          "https://www.facebook.com/profile.php?id=61588978691494",
          "https://discord.gg/n6Kd9fwja"
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      F-28: preload the two woff2 files the above-fold hero text needs (latin
      subsets): Space Grotesk for the h1, DM Sans for body. All three families
      are variable fonts, so one file covers every weight — trimming the
      unused 300/italic axes would not save bytes. These URLs are versioned by
      Google; refresh them from the css2 response if the font request below
      changes. A stale preload 404s harmlessly (the CSS still loads the font).
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/spacegrotesk/v22/V8mDoQDjQSkFtoMM3T6r8E7mPbF4Cw.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/dmsans/v17/rP2Hp2ywxg089UriCZOIHQ.woff2"
    />
    <!-- Load webfonts without blocking first render. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
