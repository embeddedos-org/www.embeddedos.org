---
# cPanel Git Version Control deployment for the prerendered static build.
#
# Lives in client/public/ for the same reason .htaccess does: vite copies this
# directory into dist/public on every build, so the file survives a rebuild of
# the deploy branch. Added to that branch by hand it would be deleted by the
# next rsync, which is exactly how .htaccess went missing once before.
#
# cPanel runs these tasks as the cPanel user after "Deploy HEAD Commit". A push
# to GitHub does not trigger them: in cPanel you still press "Update from
# Remote", then "Deploy HEAD Commit".
#
# DEPLOYPATH uses $HOME rather than a hardcoded /home/<user>/ so that this file
# carries no account name. Change it if the document root for this domain is not
# public_html — an addon domain or subdomain has its own directory.
#
# Deliberately no delete step. Overwriting is safe; emptying a directory is not,
# and if DEPLOYPATH is ever wrong a delete would take unrelated files with it.
# The cost is that superseded content-hashed bundles in assets/ accumulate. They
# are never referenced — each build's HTML names only its own hashes — so they
# waste disk and nothing else, and can be cleared out by hand when it matters.
#
# Only .htaccess is copied by name at the root. The `*` glob covers every directory and
# regular file but skips dotfiles, which is why .htaccess needs its own line and
# why this file and the .app-shell.html build cache never reach the document
# root at all. assets/.htaccess rides inside the assets/ directory copy (cp -R
# copies a directory's contents including dotfiles) and is also copied by name
# below, so the hashed-assets cache rule ships with the build (www #120).
#
# The last task is a stopgap for www #128: it turns off PHP's session upload
# progress in public_html/.user.ini, the per-directory file PHP reads where it
# runs as FastCGI or FPM (whether this host's handler reads it is unconfirmed;
# #128 asks for the effective value to be checked in cPanel). It appends one
# line rather than copying a file because, under PHP-FPM, cPanel's MultiPHP
# INI Editor keeps the host's own PHP settings in that same file, and a copy
# would overwrite them. awk reads the last value the file assigns, which is
# the one PHP uses; the line is appended only when that value is not 0, so
# repeated deploys leave the file alone. If the INI Editor later rewrites the
# file, the next deploy adds the line back. This narrows the exposure only;
# the fix is upgrading the host's PHP (#128).
#
# The .htaccess copy above replaces public_html/.htaccess on every deploy. Under
# some handlers cPanel writes its own blocks there (MultiPHP Manager's PHP
# version, the INI Editor's php_flag lines), so check the live file before
# changing PHP settings in cPanel, or the next deploy will drop them.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R * $DEPLOYPATH/
    - /bin/cp .htaccess $DEPLOYPATH/
    - /bin/cp assets/.htaccess $DEPLOYPATH/assets/
    - test "$(awk -F= '/^[[:space:]]*session[.]upload_progress[.]enabled[[:space:]]*=/ { v = $2 } END { gsub(/[[:space:]\r]/, "", v); print v }' "$DEPLOYPATH/.user.ini" 2>/dev/null)" = 0 || printf '\nsession.upload_progress.enabled = 0\n' >> "$DEPLOYPATH/.user.ini"
