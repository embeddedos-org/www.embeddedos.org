<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale blocks pinch-zoom; it fails accessibility audits and is not needed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmbeddedOS — The Operating System for Every Device</title>
    <!--
      "83 supported boards" is STACK.totals.boards from shared/stack-data.ts.
      This read "52+ platforms" — the figure retired everywhere else in the site
      because eos/boards holds 83 board definitions. The guard in
      tests/integration/stack-claims.test.ts scans visible page text, which a
      meta tag is not, so the stale claim survived here and went on being read by
      crawlers and link previews. That test now checks meta descriptions too.
    -->
    <meta
      name="description"
      content="EmbeddedOS — The open-source operating system for every device. 14 components, 83 supported boards, 300+ APIs."
    />
    <meta name="theme-color" content="#0B1D3A" />
    <link rel="canonical" href="https://www.embeddedos.org/" />
    <!--
      Icons. The site previously declared none and shipped none, so /favicon.ico
      answered 404 and tabs, bookmarks and home-screen shortcuts had no mark.
      Generated from the navbar's own logo by scripts/generate-favicons.mjs, so
      the tab icon cannot drift from the header.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:url" content="https://www.embeddedos.org/" />
    <meta property="og:site_name" content="EmbeddedOS" />
    <meta
      property="og:title"
      content="EmbeddedOS — The Operating System for Every Device"
    />

    <meta
      property="og:image"
      content="https://www.embeddedos.org/manus-storage/hero-background_1bafea1c.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Nonprofit identity as structured data. Google reads the mission, the legal
      name and the tax ID from the page text either way, but only a reviewer
      does; this states the same facts in a form the crawler parses directly.
      Every value here is duplicated from client/src/data/foundation.ts — change
      both, or neither. tests/unit/foundation-schema.test.ts fails if they drift.
    -->

        "description": "A 501(c)(3) public charity advancing open-source embedded systems research, education and technology for the public benefit.",
        "taxID": "41-4821627",
        "nonprofitStatus": "Nonprofit501c3",
        "foundingDate": "2018",
        "areaServed": "Worldwide",
        "email": "hello@embeddedos.org",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "2601 Cortez Dr",
          "addressLocality": "Santa Clara",
          "addressRegion": "CA",
          "postalCode": "95051",

  <body>
    <div id="root"></div>
    <!--
      Analytics loads only when VITE_ANALYTICS_* are actually configured.
      Vite leaves %PLACEHOLDERS% untouched when the env var is unset, and a bare
      <script src="%VITE_ANALYTICS_ENDPOINT%/umami"> would then request a
      literal-percent URL on every page load and try to execute the HTML
      response as JavaScript.
    -->
    <script>
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (
          !endpoint ||
          !websiteId ||
          endpoint.charAt(0) === "%" ||
          websiteId.charAt(0) === "%"
        )
          return;
        var s = document.createElement("script");
        s.defer = true;
        s.src = endpoint + "/umami";
        s.setAttribute("data-website-id", websiteId);
        document.head.appendChild(s);
      })();
    </script>
  </body>
