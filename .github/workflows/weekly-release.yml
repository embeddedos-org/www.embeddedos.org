name: Weekly Release Build

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6:00 AM UTC
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-tag:
    name: Build, Tag & Release
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      changelog: ${{ steps.changelog.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "tag=$LATEST" >> $GITHUB_OUTPUT
          echo "📌 Latest tag: $LATEST"

      - name: Calculate next version
        id: tag
        run: |
          LATEST="${{ steps.latest.outputs.tag }}"
          VERSION="${LATEST#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          BUMP="${{ inputs.version_bump || 'patch' }}"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "🏷️ Next version: $NEW_TAG ($BUMP bump from $LATEST)"

      - name: Generate changelog
        id: changelog
        run: |
          LATEST="${{ steps.latest.outputs.tag }}"
          NEW_TAG="${{ steps.tag.outputs.new_tag }}"
          DATE=$(date -u +"%Y-%m-%d")

          echo "## $NEW_TAG — $DATE" > CHANGELOG_ENTRY.md
          echo "" >> CHANGELOG_ENTRY.md

          if git rev-parse "$LATEST" >/dev/null 2>&1; then
            echo "### Changes since $LATEST" >> CHANGELOG_ENTRY.md
            echo "" >> CHANGELOG_ENTRY.md

            # File change stats
            CHANGED=$(git diff --stat "$LATEST"..HEAD --shortstat 2>/dev/null || echo "Initial release")
            echo "**Stats:** $CHANGED" >> CHANGELOG_ENTRY.md
            echo "" >> CHANGELOG_ENTRY.md

            # Commit log
            echo "### Commits" >> CHANGELOG_ENTRY.md
            echo "" >> CHANGELOG_ENTRY.md
            git log "$LATEST"..HEAD --pretty=format:"- %s (%h)" 2>/dev/null >> CHANGELOG_ENTRY.md || echo "- Initial release" >> CHANGELOG_ENTRY.md
          else
            echo "### 🎉 Initial Release" >> CHANGELOG_ENTRY.md
            echo "" >> CHANGELOG_ENTRY.md
            echo "First tagged release of EmbeddedOS website." >> CHANGELOG_ENTRY.md
            echo "" >> CHANGELOG_ENTRY.md
            echo "### Included Pages" >> CHANGELOG_ENTRY.md
            for f in *.html; do
              echo "- $f" >> CHANGELOG_ENTRY.md
            done
          fi

          echo "" >> CHANGELOG_ENTRY.md
          echo "---" >> CHANGELOG_ENTRY.md
          echo "*Auto-generated by weekly release workflow*" >> CHANGELOG_ENTRY.md

          echo "changes<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG_ENTRY.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo ""
          echo "📝 Changelog:"
          cat CHANGELOG_ENTRY.md

      - name: Validate HTML
        run: |
          npm install -g html-validate
          ERRORS=0
          for file in *.html; do
            html-validate "$file" || ERRORS=$((ERRORS + 1))
          done
          echo "✅ Validation complete ($ERRORS file(s) with warnings)"
        continue-on-error: true

      - name: Check for broken links
        run: |
          for file in *.html; do
            grep -oP 'href="\K[^"#]+\.html' "$file" 2>/dev/null | sort -u | while read -r link; do
              if [ ! -f "$link" ]; then
                echo "❌ $file → $link (missing)"
              fi
            done
          done
          echo "✅ Link check complete"

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.tag.outputs.new_tag }}" -m "Release ${{ steps.tag.outputs.new_tag }} — Weekly build $(date -u +%Y-%m-%d)"
          git push origin "${{ steps.tag.outputs.new_tag }}"
          echo "✅ Tag ${{ steps.tag.outputs.new_tag }} pushed"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: "Release ${{ steps.tag.outputs.new_tag }}"
          body: ${{ steps.changelog.outputs.changes }}
          draft: false
          prerelease: false
          generate_release_notes: true

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-and-tag
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-hostgator:
    name: Deploy to HostGator (FTP)
    needs: build-and-tag
    runs-on: ubuntu-latest
    if: vars.HOSTGATOR_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ vars.FTP_REMOTE_DIR || '/public_html/' }}
          exclude: |
            **/.github/**
            **/.git/**
            **/README.md
