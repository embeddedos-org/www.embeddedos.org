name: Validate & Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate HTML files
        run: |
          echo "🔍 Validating HTML files..."
          ERRORS=0
          for file in *.html; do
            echo "  Checking $file"
            html-validate "$file" || ERRORS=$((ERRORS + 1))
          done
          if [ $ERRORS -gt 0 ]; then
            echo "⚠️ $ERRORS file(s) had validation warnings (non-blocking)"
          else
            echo "✅ All HTML files valid"
          fi
        continue-on-error: true

      - name: Check for broken internal links
        run: |
          echo "🔗 Checking internal links..."
          BROKEN=0
          for file in *.html; do
            grep -oP 'href="\K[^"#]+\.html' "$file" 2>/dev/null | sort -u | while read -r link; do
              if [ ! -f "$link" ]; then
                echo "  ❌ $file → $link (missing)"
                BROKEN=$((BROKEN + 1))
              fi
            done
          done
          echo "✅ Internal link check complete"

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-hostgator:
    name: Deploy to HostGator (FTP)
    needs: validate
    runs-on: ubuntu-latest
    if: vars.HOSTGATOR_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ vars.FTP_REMOTE_DIR || '/public_html/' }}
          exclude: |
            **/.github/**
            **/.git/**
            **/README.md
