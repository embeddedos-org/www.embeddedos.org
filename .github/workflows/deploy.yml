name: Validate, Deploy & Audit

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: npm install -g html-validate clean-css-cli

      - name: Validate HTML
        run: |
          echo "🔍 Validating HTML..."
          ERRORS=0
          for file in *.html; do
            html-validate "$file" || ERRORS=$((ERRORS + 1))
          done
          echo "⚠️ $ERRORS file(s) with warnings (non-blocking)"
        continue-on-error: true

      - name: Check internal links
        run: |
          echo "🔗 Checking internal links..."
          BROKEN=0
          for file in *.html; do
            grep -oP 'href="\K[^"#]+\.html' "$file" 2>/dev/null | sort -u | while read -r link; do
              if [ ! -f "$link" ]; then
                echo "  ❌ $file → $link (MISSING)"
                BROKEN=$((BROKEN + 1))
              fi
            done
          done
          echo "✅ Link check complete"

  build-pages:
    name: Build (Pages)
    needs: validate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Minify CSS
        run: |
          npm install -g clean-css-cli
          cleancss -o css/style.min.css css/style.css
          for f in *.html; do
            sed -i 's|css/style.css|css/style.min.css|g' "$f"
          done
          echo "✅ CSS minified"

      - name: Inject API keys
        run: |
          if [ -n "${{ vars.WEB3FORMS_KEY }}" ]; then
            sed -i "s|var key = window.__WEB3FORMS_KEY__ \|\| '';|var key = window.__WEB3FORMS_KEY__ \|\| '${{ vars.WEB3FORMS_KEY }}';|" js/forms.js
          fi
          if [ -n "${{ vars.STRIPE_DONATE_URL }}" ]; then
            sed -i "s|var stripeUrl = window.__STRIPE_DONATE_URL__ \|\| '';|var stripeUrl = window.__STRIPE_DONATE_URL__ \|\| '${{ vars.STRIPE_DONATE_URL }}';|" js/forms.js
          fi
          if [ -n "${{ vars.SENTRY_DSN }}" ]; then
            sed -i "s|var SENTRY_DSN = window.__SENTRY_DSN__ \|\| '';|var SENTRY_DSN = window.__SENTRY_DSN__ \|\| '${{ vars.SENTRY_DSN }}';|" js/monitor.js
          fi
          echo "✅ API keys injected"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true

      - name: Upload artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-pages
    if: needs.build-pages.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

  deploy-hostgator:
    name: Deploy to HostGator (FTP)
    needs: validate
    runs-on: ubuntu-latest
    if: vars.HOSTGATOR_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Minify CSS for FTP
        run: |
          npm install -g clean-css-cli
          cleancss -o css/style.min.css css/style.css
          for f in *.html; do
            sed -i 's|css/style.css|css/style.min.css|g' "$f"
          done

      - name: Inject API keys for FTP
        run: |
          if [ -n "${{ vars.WEB3FORMS_KEY }}" ]; then
            sed -i "s|var key = window.__WEB3FORMS_KEY__ \|\| '';|var key = window.__WEB3FORMS_KEY__ \|\| '${{ vars.WEB3FORMS_KEY }}';|" js/forms.js
          fi
          if [ -n "${{ vars.STRIPE_DONATE_URL }}" ]; then
            sed -i "s|var stripeUrl = window.__STRIPE_DONATE_URL__ \|\| '';|var stripeUrl = window.__STRIPE_DONATE_URL__ \|\| '${{ vars.STRIPE_DONATE_URL }}';|" js/forms.js
          fi
          if [ -n "${{ vars.SENTRY_DSN }}" ]; then
            sed -i "s|var SENTRY_DSN = window.__SENTRY_DSN__ \|\| '';|var SENTRY_DSN = window.__SENTRY_DSN__ \|\| '${{ vars.SENTRY_DSN }}';|" js/monitor.js
          fi

      - name: Deploy via FTP
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ vars.FTP_REMOTE_DIR || '/public_html/' }}
          exclude: |
            **/.github/**
            **/.git/**
            **/README.md

  lighthouse:
    name: Lighthouse Performance Audit
    needs: deploy-pages
    if: needs.deploy-pages.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse CI
        run: |
          lhci autorun \
            --collect.url="https://embeddedos-org.github.io/www.embeddedos.org/" \
            --collect.url="https://embeddedos-org.github.io/www.embeddedos.org/ecosystem.html" \
            --collect.url="https://embeddedos-org.github.io/www.embeddedos.org/product-eos.html" \
            --collect.url="https://embeddedos-org.github.io/www.embeddedos.org/about.html" \
            --collect.url="https://embeddedos-org.github.io/www.embeddedos.org/contact.html" \
            --collect.numberOfRuns=1 \
            --collect.settings.chromeFlags="--no-sandbox --headless" \
            --collect.settings.preset="desktop" \
            --assert.preset="lighthouse:recommended" \
            --assert.assertions.categories:performance="warn:lower:0.7" \
            --assert.assertions.categories:accessibility="error:lower:0.85" \
            --assert.assertions.categories:best-practices="warn:lower:0.8" \
            --assert.assertions.categories:seo="error:lower:0.85" \
            --assert.assertions.color-contrast="warn" \
            --assert.assertions.unused-css-rules="off" \
            --assert.assertions.render-blocking-resources="off" \
            --assert.assertions.uses-responsive-images="warn" \
            --upload.target="temporary-public-storage" || true

      - name: Print Results Summary
        if: always()
        run: |
          echo "========================================"
          echo "  LIGHTHOUSE PERFORMANCE GATES"
          echo "========================================"
          echo ""
          echo "  Performance:    ≥ 70% (warn)"
          echo "  Accessibility:  ≥ 85% (fail)"
          echo "  Best Practices: ≥ 80% (warn)"
          echo "  SEO:            ≥ 85% (fail)"
          echo ""
          echo "  Pages tested: 5"
          echo "    - Homepage"
          echo "    - Ecosystem"
          echo "    - Product: EoS"
          echo "    - About"
          echo "    - Contact"
          echo ""
          echo "  Results uploaded to temporary public storage."
          echo "  Check the Lighthouse CI step output above for scores and report links."
          echo "========================================"
