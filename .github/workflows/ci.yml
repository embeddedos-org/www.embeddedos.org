# Build and test on every push and pull request.
#
# Before this, the only workflow in the repository was claude-code-review.yml.
# Nothing compiled the site, nothing ran the 450 tests, and nothing noticed when
# a change broke either. Four pull requests merged into master this week with no
# automated check of any kind.
#
# The job order is deliberate. `pnpm build` must run before the test step,
# because two suites need build output and *silently skip* without it rather
# than failing:
#
#   tests/security  needs dist/index.js — 21 tests, all skipped when absent
#   e2e             needs dist/public   — Playwright serves the prerendered tree
#
# A green run that skipped every security test is worse than a red one, so the
# build is a hard dependency rather than a convenience.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A second push to the same branch makes the first run irrelevant. Cancelling it
# frees the runner instead of queueing behind work nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # 45 minutes: the link-integrity sweeps add ~15 minutes of real browser
    # navigations and outbound fetches on top of the build and test suites.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json's `packageManager` field
      # pins pnpm@10.4.1 with a hash, and specifying a version in both places
      # is a hard error in action-setup v4 (ERR_PNPM_BAD_PM_VERSION), which is
      # how this workflow failed on its first run. One source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The lockfile is generated by the exact pnpm version pinned in
      # package.json. A frozen install makes dependency drift fail closed.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      # Added once the repository was actually clean. Nine files had never been
      # formatted; without a gate the set only grows, and a formatting diff
      # mixed into a feature commit is what makes review miss the feature.
      - name: Format
        run: pnpm exec prettier --check .

      # Before the build, not after it: `pnpm build` runs scripts/prerender.mjs,
      # which drives a real Chromium to render all 99 routes to static HTML. CI
      # failed here on its second run with "Executable doesn't exist" because
      # this step sat further down, next to the tests that also need a browser.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Client, prerender and server. Everything below depends on the output.
      - name: Build
        run: pnpm build

      # The deploy-drift job below diffs the deploy branch against this exact
      # build without rebuilding it.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/public
          # The drift check compares dotfiles too (.htaccess, .cpanel.yml,
          # .app-shell.html): the artifact upload drops hidden files unless
          # asked, which made origin/deploy look "unexpected".
          include-hidden-files: true
          retention-days: 1

      # A production build must be reproducible and must not rewrite tracked
      # source such as client/public/sitemap.xml.
      - name: Verify clean build
        run: git diff --exit-code

      # The security suite runs FIRST and on its own. Two reasons: `pnpm test`
      # is `vitest run` with no path, so it already includes tests/security —
      # running both meant the four-minute dependency audit executed twice —
      # and a named step is how a future skip stays visible in the job list.
      - name: Security tests
        run: pnpm test:security

      # Everything else. --exclude keeps the security suite from running a
      # second time now that it has its own step above.
      - name: Unit, integration and performance tests
        run: pnpm exec vitest run --exclude 'tests/security/**'

      # Gating, not just reporting. tests/integration/seo.test.ts already fails
      # the build on every SEO defect class and runs in the vitest step above;
      # this runs the same audit in --strict mode so the numbers and the gate
      # cannot disagree. (A mutation run proved the gap: checks the audit
      # emitted but nothing asserted stayed green when the JSON-LD was
      # stripped.) The product-detail orphan allowance the old comment
      # mentioned here is gone — those pages are linked now, and the
      # integration test asserts zero orphans. Known, tracked exemptions live
      # in scripts/seo-allowlist.json; every entry carries an expiry date, and
      # an expired or dateless entry fails this step.
      - name: SEO strict audit
        run: pnpm seo:check

      # Reporting, not gating: the internal link graph has no strict mode, so
      # it puts the numbers in the log for reviewers.
      - name: Internal link graph
        run: pnpm seo:links

      - name: Smoke tests
        run: pnpm test:smoke

      - name: Accessibility tests
        run: pnpm test:a11y

      # Link integrity runs on every build, not opt-in: a broken link is a
      # listed Google Ad Grants website-policy rejection reason ("All links
      # should work correctly"). Two sweeps:
      #
      #   test:links          clicks every internal link and asserts it lands
      #                       on the page it names, at the top. Bounded to 2
      #                       workers with 2 retries — the suite flakes under
      #                       high parallelism for load reasons outside the
      #                       code (see the note in
      #                       e2e/link-destinations.spec.ts).
      #   test:links:external fetches every outbound URL and asserts it
      #                       resolves. A documented allowlist in
      #                       e2e/external-links.spec.ts covers the handful of
      #                       legitimate destinations that block bots.
      - name: Link integrity
        run: pnpm test:links && pnpm test:links:external

      # The report is what makes a failed browser test diagnosable after the
      # runner is gone. Uploaded only on failure — on success it is noise.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The PHP endpoint unit tests (tests/php/*.test.php) are plain `php`
  # invocations with no phpunit dependency: each file requires its endpoint,
  # which returns early under the CLI SAPI, and asserts on the pure functions.
  # They need no build, database, or browser, and they run in milliseconds —
  # but until now no workflow executed them at all, so this job runs them on
  # their own, independent of the long browser-bound suite above.
  php-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # shivammathur/setup-php is the standard action for installing PHP on
      # GitHub runners. The endpoints deliberately avoid mbstring (PCRE /u
      # instead), so the default extension set is sufficient.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      # Mirrors `pnpm test:php` verbatim without requiring a pnpm install.
      - name: PHP endpoint tests
        run: php tests/php/apply.test.php && php tests/php/contact.test.php

  # The deploy branch is an orphan branch whose root must be exactly the
  # contents of dist/public; scripts/deploy-branch.mjs replaces it wholesale
  # from a fresh build, but the deploy itself is manual. This job diffs the
  # branch tree against the build above and fails on files the build could
  # never have produced (the hand-edit class that once broke .htaccess).
  # Expected drift only warns: a branch that trails the build between manual
  # deploys, and index.html for routes App.tsx no longer declares.
  deploy-drift:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4
        with:
          # The deploy ref is a separate orphan branch; the default shallow
          # fetch does not include it.
          fetch-depth: 0

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/public

      - name: Check deploy-branch drift
        run: node scripts/check-deploy-drift.mjs
