  <style>
/* ── Upgraded nav: mega-menu, donate button, logo-sub ── */
.logo-sub { font-size: 0.6rem; font-weight: 600; letter-spacing: 0.08em; color: var(--text-muted); margin-left: 4px; display: block; line-height: 1; }
.nav-donate-btn { background: #3fb950 !important; color: #fff !important; border: none !important; font-weight: 700; margin-left: 0.5rem; }
.nav-donate-btn:hover { background: #56d364 !important; box-shadow: 0 0 16px rgba(63,185,80,0.4); }
.nav-mega { display: grid !important; grid-template-columns: repeat(4, 1fr); gap: 0; min-width: 600px; padding: 1rem !important; }
.mega-col { padding: 0 1rem; }
.mega-col + .mega-col { border-left: 1px solid var(--border-color); }
.mega-col-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 0.5rem; }
.mega-col a { display: block; padding: 0.3rem 0.4rem; border-radius: 4px; font-size: 0.85rem; }
/* ── Social GitHub icon ── */
.social-github { color: var(--text-secondary) !important; }
.social-github:hover { color: var(--text-primary) !important; }
/* ── Footer Apache badge ── */
.badge-blue { background: var(--blue-dim); color: var(--blue); }
</style>
