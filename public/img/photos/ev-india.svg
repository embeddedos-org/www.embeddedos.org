<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a0a0a"/>
    </linearGradient>
    <radialGradient id="warm" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#warm)"/>
  <!-- Audience silhouettes -->
  <g fill="rgba(255,255,255,0.08)">
    <ellipse cx="80" cy="320" rx="25" ry="40"/><ellipse cx="140" cy="310" rx="22" ry="35"/>
    <ellipse cx="200" cy="325" rx="25" ry="40"/><ellipse cx="260" cy="315" rx="22" ry="35"/>
    <ellipse cx="320" cy="320" rx="25" ry="40"/><ellipse cx="380" cy="310" rx="22" ry="35"/>
    <ellipse cx="440" cy="325" rx="25" ry="40"/><ellipse cx="500" cy="315" rx="22" ry="35"/>
    <ellipse cx="560" cy="320" rx="25" ry="40"/><ellipse cx="620" cy="310" rx="22" ry="35"/>
    <ellipse cx="680" cy="325" rx="25" ry="40"/><ellipse cx="740" cy="315" rx="22" ry="35"/>
  </g>
  <!-- Stage backdrop -->
  <rect x="100" y="60" width="600" height="200" rx="6" fill="#0d1117" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <!-- Banner -->
  <rect x="120" y="80" width="560" height="80" rx="4" fill="#060912"/>
  <text x="400" y="120" font-family="monospace" font-size="20" font-weight="bold" fill="#f59e0b" text-anchor="middle">EoS Foundation</text>
  <text x="400" y="145" font-family="monospace" font-size="13" fill="#fbbf24" text-anchor="middle">India Chapter Launch · Bangalore</text>
  <!-- Decorative elements -->
  <circle cx="180" cy="200" r="15" fill="rgba(245,158,11,0.2)" stroke="rgba(245,158,11,0.4)" stroke-width="1"/>
  <circle cx="620" cy="200" r="15" fill="rgba(245,158,11,0.2)" stroke="rgba(245,158,11,0.4)" stroke-width="1"/>
  <!-- Flags/banners -->
  <rect x="150" y="170" width="8" height="50" fill="rgba(245,158,11,0.4)"/>
  <polygon points="158,170 185,182 158,194" fill="rgba(245,158,11,0.6)"/>
  <rect x="642" y="170" width="8" height="50" fill="rgba(245,158,11,0.4)"/>
  <polygon points="642,170 615,182 642,194" fill="rgba(245,158,11,0.6)"/>
  <!-- Stats -->
  <text x="400" y="260" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle">Hackathon · Demos · Community Dinner</text>
  <text x="400" y="380" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle">CHAPTER LAUNCH · BANGALORE, INDIA · NOV 12–13</text>
</svg>