<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0d1a3a"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#spot)"/>
  <!-- Conference floor grid -->
  <g stroke="rgba(59,130,246,0.08)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  <!-- Main stage -->
  <rect x="150" y="60" width="500" height="200" rx="8" fill="url(#stage)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <!-- Screen -->
  <rect x="180" y="80" width="440" height="140" rx="4" fill="#0a1628" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
  <!-- Screen content - EoS logo area -->
  <rect x="200" y="95" width="400" height="110" rx="3" fill="#060912"/>
  <text x="400" y="140" font-family="monospace" font-size="22" font-weight="bold" fill="#3b82f6" text-anchor="middle">EoS Foundation</text>
  <text x="400" y="165" font-family="monospace" font-size="13" fill="#60a5fa" text-anchor="middle">@ Embedded World NA 2026</text>
  <text x="400" y="185" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)" text-anchor="middle">Nashville Music City Center · June 8–10</text>
  <!-- Podium -->
  <rect x="360" y="240" width="80" height="30" rx="4" fill="#1e3a5f" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
  <!-- Audience dots -->
  <g fill="rgba(255,255,255,0.15)">
    <circle cx="100" cy="310" r="6"/><circle cx="140" cy="300" r="5"/><circle cx="180" cy="315" r="6"/>
    <circle cx="220" cy="305" r="5"/><circle cx="260" cy="310" r="6"/><circle cx="300" cy="300" r="5"/>
    <circle cx="340" cy="315" r="6"/><circle cx="380" cy="305" r="5"/><circle cx="420" cy="310" r="6"/>
    <circle cx="460" cy="300" r="5"/><circle cx="500" cy="315" r="6"/><circle cx="540" cy="305" r="5"/>
    <circle cx="580" cy="310" r="6"/><circle cx="620" cy="300" r="5"/><circle cx="660" cy="315" r="6"/>
    <circle cx="700" cy="305" r="5"/>
  </g>
  <!-- Booth signs -->
  <rect x="60" y="260" width="60" height="40" rx="4" fill="#1e3a5f" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
  <text x="90" y="285" font-family="monospace" font-size="8" fill="#60a5fa" text-anchor="middle">EoS</text>
  <rect x="680" y="260" width="60" height="40" rx="4" fill="#1e3a5f" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
  <text x="710" y="285" font-family="monospace" font-size="8" fill="#60a5fa" text-anchor="middle">BOOTH</text>
  <!-- Label -->
  <text x="400" y="380" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle">TRADE SHOW · NASHVILLE, USA</text>
</svg>