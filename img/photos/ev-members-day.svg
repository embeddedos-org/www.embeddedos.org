<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0f1a0a"/>
    </linearGradient>
    <radialGradient id="green" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#green)"/>
  <!-- Round table -->
  <ellipse cx="400" cy="240" rx="200" ry="80" fill="#0d1a1a" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
  <!-- People around table -->
  <g fill="rgba(16,185,129,0.6)" stroke="rgba(16,185,129,0.8)" stroke-width="1">
    <circle cx="400" cy="160" r="18"/><circle cx="480" cy="175" r="18"/>
    <circle cx="540" cy="215" r="18"/><circle cx="540" cy="265" r="18"/>
    <circle cx="480" cy="305" r="18"/><circle cx="400" cy="320" r="18"/>
    <circle cx="320" cy="305" r="18"/><circle cx="260" cy="265" r="18"/>
    <circle cx="260" cy="215" r="18"/><circle cx="320" cy="175" r="18"/>
  </g>
  <!-- Center logo -->
  <circle cx="400" cy="240" r="40" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.4)" stroke-width="2"/>
  <text x="400" y="237" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">EoS</text>
  <text x="400" y="252" font-family="monospace" font-size="8" fill="#34d399" text-anchor="middle">FOUNDATION</text>
  <!-- Title -->
  <text x="400" y="60" font-family="monospace" font-size="18" font-weight="bold" fill="#34d399" text-anchor="middle">Annual Members Day 2026</text>
  <text x="400" y="85" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">San Francisco · Also Streamed Live</text>
  <text x="400" y="380" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle">HYBRID ANNUAL · DEC 5, 2026</text>
</svg>