      <stop offset="100%" stop-color="#1a0a1e"/>
    </linearGradient>
    <radialGradient id="fire" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
