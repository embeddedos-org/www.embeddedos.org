<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f2040"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Workshop table -->
  <rect x="100" y="180" width="600" height="120" rx="8" fill="#0d1a2e" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <!-- Laptops on table -->
  <g>
    <rect x="130" y="150" width="120" height="80" rx="4" fill="#1e3a5f" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
    <rect x="138" y="158" width="104" height="64" rx="2" fill="#060912"/>
    <text x="190" y="195" font-family="monospace" font-size="9" fill="#3b82f6" text-anchor="middle">EoS RTOS</text>
    <rect x="130" y="228" width="120" height="8" rx="2" fill="#0d1a2e"/>
  </g>
  <g>
    <rect x="340" y="150" width="120" height="80" rx="4" fill="#1e3a5f" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
    <rect x="348" y="158" width="104" height="64" rx="2" fill="#060912"/>
    <text x="400" y="195" font-family="monospace" font-size="9" fill="#3b82f6" text-anchor="middle">EAI Runtime</text>
    <rect x="340" y="228" width="120" height="8" rx="2" fill="#0d1a2e"/>
  </g>
  <g>
    <rect x="550" y="150" width="120" height="80" rx="4" fill="#1e3a5f" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
    <rect x="558" y="158" width="104" height="64" rx="2" fill="#060912"/>
    <text x="610" y="195" font-family="monospace" font-size="9" fill="#3b82f6" text-anchor="middle">eBoot Chain</text>
    <rect x="550" y="228" width="120" height="8" rx="2" fill="#0d1a2e"/>
  </g>
  <!-- Toradex board illustration -->
  <rect x="320" y="310" width="160" height="60" rx="6" fill="#0a1628" stroke="rgba(34,211,153,0.5)" stroke-width="2"/>
  <text x="400" y="335" font-family="monospace" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">Toradex Verdin</text>
  <text x="400" y="352" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle">i.MX 8M Plus · EoS RTOS</text>
  <!-- Title -->
  <text x="400" y="60" font-family="monospace" font-size="18" font-weight="bold" fill="#60a5fa" text-anchor="middle">Toradex × EoS Workshop</text>
  <text x="400" y="85" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">From Boot to Inference · Lausanne, Switzerland</text>
  <text x="400" y="385" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle">HYBRID WORKSHOP · SEP 30, 2026</text>
</svg>