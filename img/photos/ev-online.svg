<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#glow)"/>
  <!-- Multiple screens layout -->
  <!-- Main screen -->
  <rect x="80" y="60" width="380" height="220" rx="8" fill="#0d1117" stroke="rgba(124,58,237,0.5)" stroke-width="2"/>
  <rect x="95" y="75" width="350" height="190" rx="4" fill="#060912"/>
  <text x="270" y="155" font-family="monospace" font-size="16" font-weight="bold" fill="#a78bfa" text-anchor="middle">Embedded Online</text>
  <text x="270" y="178" font-family="monospace" font-size="12" fill="#7c3aed" text-anchor="middle">Conference 2026</text>
  <text x="270" y="200" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)" text-anchor="middle">LIVE STREAM</text>
  <!-- Live indicator -->
  <circle cx="120" cy="92" r="5" fill="#ef4444"/>
  <text x="132" y="96" font-family="monospace" font-size="9" fill="#ef4444">LIVE</text>
  <!-- Side screens -->
  <rect x="490" y="60" width="230" height="100" rx="6" fill="#0d1117" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <rect x="503" y="72" width="204" height="76" rx="3" fill="#060912"/>
  <circle cx="605" cy="110" r="20" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.5)" stroke-width="1"/>
  <text x="605" y="115" font-family="monospace" font-size="10" fill="#a78bfa" text-anchor="middle">👤</text>
  <rect x="490" y="180" width="230" height="100" rx="6" fill="#0d1117" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <rect x="503" y="192" width="204" height="76" rx="3" fill="#060912"/>
  <circle cx="605" cy="230" r="20" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.5)" stroke-width="1"/>
  <text x="605" y="235" font-family="monospace" font-size="10" fill="#a78bfa" text-anchor="middle">👤</text>
  <!-- Viewer count -->
  <rect x="80" y="300" width="380" height="40" rx="6" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="270" y="325" font-family="monospace" font-size="11" fill="#a78bfa" text-anchor="middle">● 2,847 viewers · Q&amp;A open</text>
  <!-- Chat bubbles -->
  <rect x="490" y="300" width="230" height="60" rx="6" fill="rgba(124,58,237,0.08)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="505" y="320" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">dev42: great session!</text>
  <text x="505" y="338" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">eos_fan: when is v1.0?</text>
  <text x="400" y="380" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle">ONLINE CONFERENCE · GLOBAL</text>
</svg>