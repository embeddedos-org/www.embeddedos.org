<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0a1a0a"/>
    </linearGradient>
    <radialGradient id="academic" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#academic)"/>
  <!-- Academic venue columns -->
  <rect x="80" y="100" width="30" height="200" fill="#0d1a1a" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <rect x="690" y="100" width="30" height="200" fill="#0d1a1a" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <!-- Presentation screen -->
  <rect x="150" y="80" width="500" height="180" rx="6" fill="#060912" stroke="rgba(16,185,129,0.4)" stroke-width="2"/>
  <!-- Proof/formula content -->
  <text x="400" y="130" font-family="monospace" font-size="14" fill="#34d399" text-anchor="middle">∀ ctx ∈ ContextSwitch:</text>
  <text x="400" y="155" font-family="monospace" font-size="14" fill="#34d399" text-anchor="middle">  invariant(stack) ∧ correct(reg)</text>
  <text x="400" y="185" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">Machine-Checked Proof · Cortex-M + RV32</text>
  <text x="400" y="210" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.3)" text-anchor="middle">EoS RTOS Context-Switch Correctness</text>
  <!-- Podium -->
  <rect x="360" y="280" width="80" height="30" rx="4" fill="#0d1a1a" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
  <circle cx="400" cy="265" r="15" fill="rgba(16,185,129,0.2)" stroke="rgba(16,185,129,0.5)" stroke-width="1"/>
  <!-- Title -->
  <text x="400" y="55" font-family="monospace" font-size="18" font-weight="bold" fill="#34d399" text-anchor="middle">EoS @ ESWEEK 2026</text>
  <text x="400" y="78" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Formal Verification · Berlin, Germany</text>
  <text x="400" y="380" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle">ACADEMIC CONFERENCE · SEP 21–25, 2026</text>
</svg>