<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060912"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Network topology - nodes -->
  <!-- Central hub -->
  <circle cx="400" cy="200" r="35" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="196" font-family="monospace" font-size="9" font-weight="bold" fill="#3b82f6" text-anchor="middle">EIPC</text>
  <text x="400" y="210" font-family="monospace" font-size="8" fill="#60a5fa" text-anchor="middle">Hub</text>
  <!-- Satellite nodes -->
  <circle cx="200" cy="100" r="25" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.5"/>
  <text x="200" y="104" font-family="monospace" font-size="8" fill="#10b981" text-anchor="middle">Node A</text>
  <circle cx="600" cy="100" r="25" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.5"/>
  <text x="600" y="104" font-family="monospace" font-size="8" fill="#10b981" text-anchor="middle">Node B</text>
  <circle cx="150" cy="280" r="25" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="150" y="284" font-family="monospace" font-size="8" fill="#8b5cf6" text-anchor="middle">Node C</text>
  <circle cx="650" cy="280" r="25" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="650" y="284" font-family="monospace" font-size="8" fill="#8b5cf6" text-anchor="middle">Node D</text>
  <circle cx="400" cy="340" r="25" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="344" font-family="monospace" font-size="8" fill="#f59e0b" text-anchor="middle">Node E</text>
  <!-- Connections with integrity indicators -->
  <line x1="375" y1="170" x2="220" y2="120" stroke="rgba(16,185,129,0.4)" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="425" y1="170" x2="580" y2="120" stroke="rgba(16,185,129,0.4)" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="370" y1="220" x2="170" y2="265" stroke="rgba(139,92,246,0.4)" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="430" y1="220" x2="630" y2="265" stroke="rgba(139,92,246,0.4)" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="400" y1="235" x2="400" y2="315" stroke="rgba(245,158,11,0.4)" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- Integrity badges -->
  <circle cx="300" cy="135" r="8" fill="#10b981"/><text x="300" y="139" font-family="monospace" font-size="7" fill="#fff" text-anchor="middle">✓</text>
  <circle cx="500" cy="135" r="8" fill="#10b981"/><text x="500" y="139" font-family="monospace" font-size="7" fill="#fff" text-anchor="middle">✓</text>
  <circle cx="270" cy="248" r="8" fill="#8b5cf6"/><text x="270" y="252" font-family="monospace" font-size="7" fill="#fff" text-anchor="middle">✓</text>
  <circle cx="530" cy="248" r="8" fill="#8b5cf6"/><text x="530" y="252" font-family="monospace" font-size="7" fill="#fff" text-anchor="middle">✓</text>
  <text x="400" y="25" font-family="monospace" font-size="13" font-weight="bold" fill="#60a5fa" text-anchor="middle">Layered Network Topology — Node Integrity</text>
  <text x="400" y="385" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.3)" text-anchor="middle">EmbeddedOS Neural Research · Capability-Based Authorization</text>
</svg>