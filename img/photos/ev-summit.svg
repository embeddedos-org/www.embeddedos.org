<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0a0a2e"/>
    </linearGradient>
    <radialGradient id="keynote" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#keynote)"/>
  <!-- Grand stage -->
  <rect x="50" y="80" width="700" height="220" rx="8" fill="#0d1117" stroke="rgba(59,130,246,0.4)" stroke-width="2"/>
  <!-- Massive screen -->
  <rect x="80" y="100" width="640" height="160" rx="4" fill="#060912"/>
  <!-- Keynote content -->
  <text x="400" y="155" font-family="monospace" font-size="22" font-weight="bold" fill="#3b82f6" text-anchor="middle">The Next Decade of</text>
  <text x="400" y="183" font-family="monospace" font-size="22" font-weight="bold" fill="#60a5fa" text-anchor="middle">Open Embedded AI</text>
  <text x="400" y="215" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="middle">EoS Foundation President Keynote · Embedded Summit 2026</text>
  <!-- Speaker spotlight -->
  <circle cx="400" cy="290" r="25" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.5)" stroke-width="2"/>
  <text x="400" y="296" font-family="monospace" font-size="14" fill="#3b82f6" text-anchor="middle">👤</text>
  <!-- Audience -->
  <g fill="rgba(255,255,255,0.06)">
    <ellipse cx="100" cy="340" rx="20" ry="30"/><ellipse cx="160" cy="335" rx="18" ry="28"/>
    <ellipse cx="220" cy="340" rx="20" ry="30"/><ellipse cx="280" cy="335" rx="18" ry="28"/>
    <ellipse cx="340" cy="340" rx="20" ry="30"/><ellipse cx="460" cy="340" rx="20" ry="30"/>
    <ellipse cx="520" cy="335" rx="18" ry="28"/><ellipse cx="580" cy="340" rx="20" ry="30"/>
    <ellipse cx="640" cy="335" rx="18" ry="28"/><ellipse cx="700" cy="340" rx="20" ry="30"/>
  </g>
  <text x="400" y="55" font-family="monospace" font-size="18" font-weight="bold" fill="#60a5fa" text-anchor="middle">Keynote @ Embedded Summit 2026</text>
  <text x="400" y="380" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle">KEYNOTE · SANTA CLARA, CA · OCT 15–17, 2026</text>
</svg>