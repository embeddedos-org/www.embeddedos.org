<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03050d"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Grid -->
  <g stroke="rgba(59,130,246,0.06)" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- Logo area -->
  <rect x="80" y="80" width="60" height="60" rx="14" fill="rgba(59,130,246,0.2)" stroke="rgba(59,130,246,0.5)" stroke-width="2"/>
  <text x="110" y="118" font-family="monospace" font-size="24" font-weight="bold" fill="#3b82f6" text-anchor="middle">E</text>
  <!-- Title -->
  <text x="160" y="118" font-family="monospace" font-size="28" font-weight="bold" fill="white">EmbeddedOS Foundation</text>
  <!-- Tagline -->
  <text x="80" y="230" font-family="monospace" font-size="52" font-weight="900" fill="white">Open. Secure.</text>
  <text x="80" y="300" font-family="monospace" font-size="52" font-weight="900" fill="#3b82f6">Embedded AI.</text>
  <!-- Description -->
  <text x="80" y="380" font-family="monospace" font-size="22" fill="rgba(255,255,255,0.6)">Open-source RTOS · Neural Interfaces · Edge AI</text>
  <!-- Stats row -->
  <rect x="80" y="430" width="200" height="80" rx="10" fill="rgba(59,130,246,0.1)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="180" y="462" font-family="monospace" font-size="28" font-weight="bold" fill="#3b82f6" text-anchor="middle">14</text>
  <text x="180" y="488" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle">Products</text>
  <rect x="300" y="430" width="200" height="80" rx="10" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="400" y="462" font-family="monospace" font-size="28" font-weight="bold" fill="#8b5cf6" text-anchor="middle">41+</text>
  <text x="400" y="488" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle">Contributors</text>
  <rect x="520" y="430" width="200" height="80" rx="10" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="620" y="462" font-family="monospace" font-size="28" font-weight="bold" fill="#10b981" text-anchor="middle">Apache 2</text>
  <text x="620" y="488" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle">License</text>
  <!-- Right side visual -->
  <circle cx="1000" cy="315" r="200" fill="none" stroke="rgba(59,130,246,0.1)" stroke-width="1"/>
  <circle cx="1000" cy="315" r="150" fill="none" stroke="rgba(59,130,246,0.08)" stroke-width="1"/>
  <circle cx="1000" cy="315" r="100" fill="none" stroke="rgba(59,130,246,0.12)" stroke-width="1"/>
  <circle cx="1000" cy="315" r="50" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.4)" stroke-width="2"/>
  <text x="1000" y="310" font-family="monospace" font-size="14" font-weight="bold" fill="#3b82f6" text-anchor="middle">EoS</text>
  <text x="1000" y="328" font-family="monospace" font-size="10" fill="#60a5fa" text-anchor="middle">RTOS</text>
  <!-- Orbiting nodes -->
  <circle cx="1000" cy="165" r="12" fill="rgba(139,92,246,0.3)" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="1150" cy="315" r="12" fill="rgba(16,185,129,0.3)" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="1000" cy="465" r="12" fill="rgba(245,158,11,0.3)" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="850" cy="315" r="12" fill="rgba(239,68,68,0.3)" stroke="#ef4444" stroke-width="1.5"/>
  <!-- URL -->
  <text x="80" y="590" font-family="monospace" font-size="18" fill="rgba(255,255,255,0.4)">www.embeddedos.org</text>
</svg>
